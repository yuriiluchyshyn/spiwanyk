<!DOCTYPE html>
<html lang="uk">
  <head>
    <!-- 1. Технічна база -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3c72" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 2. Головні SEO-теги -->
    <title>Файні Співанки — Давай співати: збірка українських пісень з акордами</title>

    />

      name="keywords"
      content="українські пісні, пісні з акордами, співаник, тексти пісень, акорди, пластові пісні, співати разом"
    />

    <link rel="canonical" href="https://spivanyk.yluch.app/" />

    <!-- 3. Open Graph (соцмережі та месенджери) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Файні Співанки" />
    <meta property="og:title" content="Файні Співанки — Давай співати: збірка українських пісень з акордами" />
    <meta
      property="og:description"
      content="Колекція українських пісень зі словами та акордами. Створюйте власні співаники та співайте разом."
    />
    <meta property="og:url" content="https://spivanyk.yluch.app/" />
    <meta property="og:image" content="https://spivanyk.yluch.app/og-image.jpg" />
    <meta property="og:locale" content="uk_UA" />

    <!-- 4. Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Файні Співанки — Давай співати: збірка українських пісень з акордами" />
    <meta
      name="twitter:description"
      content="Колекція українських пісень зі словами та акордами. Створюйте власні співаники та співайте разом."
    />
    <meta name="twitter:image" content="https://spivanyk.yluch.app/og-image.jpg" />

    <!-- 5. Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KQMVQDNTPK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view: false — перегляди сторінок шлемо вручну з React (див. AnalyticsTracker),
      // щоб коректно рахувати переходи в SPA і не дублювати перше завантаження.
      gtag('config', 'G-KQMVQDNTPK', { send_page_view: false });
    </script>
  </head>
  <body>
